title: Hero's Guild
description: >-
  The player guide for Hero's Guild, a tactical guild-management RPG where the
  heroes are people, the deaths are permanent, and somebody has to write the
  funeral invoices.

url: https://surinenc.github.io
baseurl: /herosguild-doc

theme: jekyll-theme-cayman

# Store link in the page banner (_layouts/default.html). The UTM tag is read
# back in Steamworks under Marketing & Visibility -> UTM Analytics. Keep the
# values constant across pages: Steam hides parameter combinations whose
# visits fall below a minimum threshold, so splitting the tag per guide would
# scatter a small number of visits into rows that never appear.
steam_app_id: 4268730
steam_utm: "utm_source=wiki&utm_medium=referral&utm_campaign=player_guide"

# Discord invite in the page banner (_layouts/default.html). A permanent
# invite, so it does not need revisiting; if it is ever replaced, replacing it
# here changes every page at once.
discord_invite: https://discord.gg/5GFVYWD2em

google_site_verification: ARD0dKlvNrJbWupErIcjZHEMV-9IOiJWJBQQNbtTRII

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false

exclude:
  - CLAUDE.md
  - GAME-STATS.md
  - PORTFOLIO-REVIEW.md
  - TRIALS-DESIGN-PLAN.md
  - .specify
  - .claude
  - specs
  - heroworld
  - HUMANITY-SYSTEMS-PROPOSAL.md
  - SOCIAL-SYSTEMS-PROPOSAL.md
  - HUMANITY-PLAYER-IMPACT-BASELINE.json
  - CREATOR-OUTREACH.md
